services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI before starting Compose}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Compose}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
